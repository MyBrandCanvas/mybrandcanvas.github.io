<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyBrandCanvas — Coming Soon</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a0533 0%, #3d1a6e 50%, #6a2fa0 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      color: #fff;
      padding: 24px;
    }

    .container {
      text-align: center;
      max-width: 520px;
      width: 100%;
    }

    .logo {
      font-size: clamp(28px, 6vw, 48px);
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .tagline {
      font-size: clamp(11px, 2vw, 13px);
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 48px;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: rgba(255, 255, 255, 0.3);
      margin: 0 auto 48px;
    }

    .form {
      display: flex;
      gap: 0;
      max-width: 380px;
      margin: 0 auto;
    }

    .form input {
      flex: 1;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-right: none;
      color: #fff;
      padding: 14px 16px;
      font-size: 14px;
      outline: none;
      border-radius: 4px 0 0 4px;
      transition: border-color 0.2s;
    }

    .form input::placeholder { color: rgba(255, 255, 255, 0.4); }
    .form input:focus { border-color: rgba(255, 255, 255, 0.6); }

    .form button {
      background: #fff;
      color: #3d1a6e;
      border: none;
      padding: 14px 22px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border-radius: 0 4px 4px 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .form button:hover { opacity: 0.9; }

    .thanks {
      display: none;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    .footer {
      margin-top: 64px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">MyBrandCanvas</div>
    <div class="tagline">Launching Soon</div>
    <div class="divider"></div>

    <form class="form" onsubmit="handleSubmit(event)">
      <input type="email" id="email" placeholder="your@email.com" required />
      <button type="submit">Notify Me</button>
    </form>
    <p class="thanks" id="thanks">You're on the list. We'll be in touch.</p>

    <div class="footer">&copy; 2026 MyBrandCanvas</div>
  </div>

  <script>
    function handleSubmit(e) {
      e.preventDefault();
      document.querySelector('.form').style.display = 'none';
      document.getElementById('thanks').style.display = 'block';
    }
  </script>
</body>
</html>
